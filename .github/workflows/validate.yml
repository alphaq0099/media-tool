        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--video-check artifacts/video-check.json --settings-file artifacts/ci-video.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
