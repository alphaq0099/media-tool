        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--compress-check artifacts/compress-check.json --settings-file artifacts/ci-compress.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path artifacts/compress-check.json)) { throw 'Packaged compression check did not finish' }
          if ((Get-Content artifacts/compress-check.json -Raw | ConvertFrom-Json).passed -ne $true) { throw 'Packaged compression check failed' }
      - name: Linux packaged compression check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/MediaTool/MediaTool --compress-check artifacts/compress-check.json --settings-file artifacts/ci-compress.ini --exit-after-ms 110000
          python -c "import json; from pathlib import Path; assert json.loads(Path('artifacts/compress-check.json').read_text())['passed']"
      - name: Windows packaged format check
