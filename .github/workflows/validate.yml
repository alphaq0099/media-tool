      - name: Linux packaged track selection check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/MediaTool/MediaTool --tracks-check artifacts/tracks-check.json --settings-file artifacts/ci-tracks.ini --exit-after-ms 110000
          python -c "import json; from pathlib import Path; assert json.loads(Path('artifacts/tracks-check.json').read_text())['passed']"
      - name: Windows packaged remux check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--remux-check artifacts/remux-check.json --settings-file artifacts/ci-remux.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path artifacts/remux-check.json)) { throw 'Packaged remux check did not finish' }
