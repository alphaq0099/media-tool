          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--format-check artifacts/format-check.json --settings-file artifacts/ci-format.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path artifacts/format-check.json)) { throw 'Packaged format check did not finish' }
          if ((Get-Content artifacts/format-check.json -Raw | ConvertFrom-Json).passed -ne $true) { throw 'Packaged format check failed' }
      - name: Linux packaged format check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/MediaTool/MediaTool --format-check artifacts/format-check.json --settings-file artifacts/ci-format.ini --exit-after-ms 110000
          python -c "import json; from pathlib import Path; assert json.loads(Path('artifacts/format-check.json').read_text())['passed']"
      - name: Windows packaged WebM check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--webm-check artifacts/webm-check.json --settings-file artifacts/ci-webm.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path artifacts/webm-check.json)) { throw 'Packaged WebM check did not finish' }
          if ((Get-Content artifacts/webm-check.json -Raw | ConvertFrom-Json).passed -ne $true) { throw 'Packaged WebM check failed' }
      - name: Linux packaged WebM check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/MediaTool/MediaTool --webm-check artifacts/webm-check.json --settings-file artifacts/ci-webm.ini --exit-after-ms 110000
          python -c "import json; from pathlib import Path; assert json.loads(Path('artifacts/webm-check.json').read_text())['passed']"
      - name: Windows packaged track selection check
        if: runner.os == 'Windows'
