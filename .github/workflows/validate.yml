        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--tracks-check artifacts/tracks-check.json --settings-file artifacts/ci-tracks.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
