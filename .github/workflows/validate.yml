          python -c "import json; from pathlib import Path; assert json.loads(Path('artifacts/remux-check.json').read_text())['passed']"
      - name: Windows packaged H.265 target-size check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--hevc-size-check artifacts/hevc-size-check.json --settings-file artifacts/ci-hevc-size.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path artifacts/hevc-size-check.json)) { throw 'Packaged H.265 size check did not finish' }
          if ((Get-Content artifacts/hevc-size-check.json -Raw | ConvertFrom-Json).passed -ne $true) { throw 'Packaged H.265 size check failed' }
      - name: Linux packaged H.265 target-size check
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/MediaTool/MediaTool --hevc-size-check artifacts/hevc-size-check.json --settings-file artifacts/ci-hevc-size.ini --exit-after-ms 110000
          python -c "import json; from pathlib import Path; assert json.loads(Path('artifacts/hevc-size-check.json').read_text())['passed']"
      - name: Windows packaged ZIP check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MediaTool/MediaTool.exe -ArgumentList '--archive-check artifacts/archive-check.json --settings-file artifacts/ci-archive.ini --exit-after-ms 110000' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0 -or !(Test-Path artifacts/archive-check.json)) { throw 'Packaged ZIP check did not finish' }
          if ((Get-Content artifacts/archive-check.json -Raw | ConvertFrom-Json).passed -ne $true) { throw 'Packaged ZIP check failed' }
